name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ejmabunda-web-api.slnx

      - name: Build
        run: dotnet build ejmabunda-web-api.slnx --configuration Release --no-restore

      # Gate the deploy: a failing test stops the job before anything is published.
      - name: Test
        run: dotnet test ejmabunda-web-api.slnx --configuration Release --no-build --verbosity normal

      # Publish the API project only; publishing the solution would also publish the test project.
      - name: Publish
        run: dotnet publish src/ejmabunda-web-api/ejmabunda-web-api.csproj -c Release -o ./publish --no-build

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ejmabunda-web-api
          package: ./publish