$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/Auth/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "{{vault:adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const response = pm.response.json();
      const token = response.token.accessToken;

      pm.test("Login response contains a JWT", function () {
        pm.expect(token).to.be.a("string").and.not.empty;
      });

      if (token) {
        await pm.vault.set("JwtToken", token);
      }
