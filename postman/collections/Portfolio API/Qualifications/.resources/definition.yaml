$kind: collection
name: Qualifications
description: |-
  CRUD for educational Qualification entries, each linked to a set of Skill IDs.
  GET endpoints are public (AllowAnonymous). POST, PUT, and DELETE require a valid
  JWT Bearer token (inherited from the collection). Referencing unknown skill IDs
  returns 400. nqfLevel is sent as a number (1-10, e.g. 4 = Grade12, 6 = Diploma,
  7 = BachelorsDegree) and returned as its enum name.
order: 5000
